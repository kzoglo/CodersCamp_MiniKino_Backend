name: CI Pipeline

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:
    inputs:
      choice_test:
        description: 'Environment to run tests against'
        required: false
        default: 'test'
        type: choice
        options:
          - test
          - staging
          - production
      bool_test:
        description: 'Run code quality checks'
        required: false
        default: true
        type: boolean

jobs:
  check_manual_dispatch:
    name: Check Manual Dispatch
    runs-on: ubuntu-latest
    steps:
      - name: Run tests
        run: |
          echo 1-choice: ${{ github.event.inputs.choice_test }}
          echo 1-bool: ${{ github.event.inputs.bool_test }}
          echo 2-choice: ${{ inputs.choice_test }}
          echo 2-bool: ${{ inputs.bool_test }}

  code-quality:
    name: Code Quality & Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.14.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check Prettier formatting
        run: npm run format:check .

      - name: Run ESLint (if configured)
        run: |
          if [ -f ".eslintrc.js" ] || [ -f ".eslintrc.json" ] || [ -f "eslint.config.js" ]; then
            npx eslint .
          else
            echo "ESLint not configured, skipping..."
          fi

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.14.0'

      - name: Install dependencies
        run: npm ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Docker Compose V2
        run: |
          # Make sure Docker CLI plugin directory exists
          mkdir -p ~/.docker/cli-plugins/
          # Download Docker Compose V2
          curl -SL https://github.com/docker/compose/releases/download/v2.23.0/docker-compose-linux-x86_64 -o ~/.docker/cli-plugins/docker-compose
          # Make it executable
          chmod +x ~/.docker/cli-plugins/docker-compose
          # Verify installation
          docker compose version

      - name: Run Docker-based tests
        run: npm run test:docker

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -f node.Dockerfile -t minikino-backend:test .

      - name: Test Docker image
        run: |
          docker run --rm minikino-backend:test node --version
          docker run --rm minikino-backend:test npm --version
